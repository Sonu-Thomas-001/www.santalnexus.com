<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8CA7D" />
      <stop offset="50%" stop-color="#D7B45A" />
      <stop offset="100%" stop-color="#BF9738" />
    </linearGradient>
  </defs>
  <!-- Background Forest Green -->
  <rect width="512" height="512" rx="100" fill="#10271D" />
  <!-- Outer Gold Border -->
  <rect x="12" y="12" width="488" height="488" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.3" />
  
  <!-- Left Bracket [ -->
  <path d="M 68 128 L 152 128 L 152 166 L 106 166 L 106 346 L 152 346 L 152 384 L 68 384 Z" fill="url(#goldGrad)" />
  
  <!-- Right Bracket ] -->
  <path d="M 444 128 L 360 128 L 360 166 L 406 166 L 406 346 L 360 346 L 360 384 L 444 384 Z" fill="url(#goldGrad)" />
  
  <!-- Stylized Handshake Emblem in Center -->
  <g fill="url(#goldGrad)">
    <!-- Left Hand / Cuff -->
    <path d="M 124 200 L 195 240 L 175 285 L 124 245 Z" opacity="0.95" />
    <!-- Right Hand / Cuff -->
    <path d="M 388 200 L 317 240 L 337 285 L 388 245 Z" opacity="0.95" />
    <!-- Clasping Hands Center -->
    <path d="M 190 238 C 215 200 248 190 278 206 C 298 217 325 245 330 268 C 315 285 292 292 270 286 L 252 300 C 240 310 220 310 208 296 C 196 282 200 265 210 252 Z" />
    <!-- Fingers Detail -->
    <rect x="220" y="270" width="22" height="42" rx="11" transform="rotate(-35 220 270)" fill="url(#goldGrad)" stroke="#10271D" stroke-width="3" />
    <rect x="240" y="280" width="22" height="42" rx="11" transform="rotate(-35 240 280)" fill="url(#goldGrad)" stroke="#10271D" stroke-width="3" />
    <rect x="260" y="290" width="22" height="42" rx="11" transform="rotate(-35 260 290)" fill="url(#goldGrad)" stroke="#10271D" stroke-width="3" />
    <rect x="280" y="300" width="22" height="42" rx="11" transform="rotate(-35 280 300)" fill="url(#goldGrad)" stroke="#10271D" stroke-width="3" />
  </g>
</svg>
